<style>
  /* ==================== THEME TOKENS ====================
     Obsidian/Outlook-dark palette. Edit here to reskin. */
  :root {
    --ink: #dcddde;          /* primary text */
    --paper: #1e1e1e;        /* page background */
    --surface: #262626;      /* raised panels: sidebar, modal, inputs */
    --line: #363636;         /* grid hairlines / borders */
    --line-strong: #454545;  /* header hairlines, input borders */
    --accent: #8b6ff0;       /* interactive accent (today, active view) */
    --accent-tint: rgba(139,111,240,0.10);
    --hover: rgba(255,255,255,0.05);
    --muted: #9a9a9a;        /* secondary text */
    --faint: #5c5c5c;        /* de-emphasised text */
    --on-accent: #ffffff;    /* text on an accent fill */
    --coral: #d67350;        /* drop-target / danger states */
    --reserved: #00c23a;     /* booked: check marks, badge, stats dot */
    --reserved-line: rgba(0,194,58,0.75);         /* booked day frame, 75% */
    --reserved-tint: rgba(0,194,58,0.05);         /* booked day fill, 5% */
    --reserved-tint-hover: rgba(0,194,58,0.12);
    --sidebar-w: 232px;
    --font-stack: "Commit Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-stack);
    font-size: 14px;
    overflow: hidden;
  }

  /* ==================== APP SHELL (sidebar | main) ==================== */
  .app { display: flex; height: 100vh; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* The scrolling region: months stack here in trip view, the week grid
     fills it in week view. */
  .months { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }

  /* ==================== SIDEBAR ==================== */
  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sidebar-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 400;
  }

  /* ---- Mini month calendar ---- */
  .mini-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  #miniTitle { font-size: 0.8rem; color: var(--ink); }
  .mini-nav {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
  }
  .mini-nav:hover { background: var(--hover); color: var(--ink); }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .mini-dow {
    font-size: 0.6rem;
    color: var(--muted);
    text-align: center;
    padding-bottom: 3px;
  }
  .mini-day {
    position: relative;
    font-family: inherit;
    font-size: 0.68rem;
    color: var(--ink);
    background: none;
    border: none;
    border-radius: 50%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .mini-day:hover { background: var(--hover); }
  .mini-day.out { color: var(--faint); }
  /* Days inside the range the main view is currently showing. */
  .mini-day.in-view { background: rgba(255,255,255,0.08); }
  .mini-day.today { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  /* A dot under any day that has entries or a country tag. */
  .mini-day.has-data::after {
    content: '';
    position: absolute;
    bottom: 1px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent);
  }
  .mini-day.today.has-data::after { background: var(--on-accent); }

  /* ---- Calendar list (the countries, as toggleable calendars) ---- */
  .legend { display: flex; flex-direction: column; gap: 2px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 3px 4px;
    border-radius: 3px;
    font-size: 0.78rem;
    min-width: 0;
  }
  .legend-item:hover { background: var(--hover); }
  /* Checkbox styled as a hollow ring that fills with the country colour
     when the calendar is switched on. */
  .legend-check {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 13px;
    height: 13px;
    margin: 0;
    border-radius: 50%;
    border: 1.5px solid var(--c, var(--muted));
    background: transparent;
    cursor: pointer;
    position: relative;
  }
  .legend-check:checked { background: var(--c, var(--muted)); }
  .legend-check:checked::after {
    content: '';
    position: absolute;
    left: 3.5px;
    top: 1px;
    width: 3px;
    height: 6px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .legend-swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    display: inline-block;
    flex: none;
  }
  input.legend-swatch {
    width: 13px;
    height: 13px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid var(--line-strong);
    background: none;
    padding: 0;
  }
  input.legend-swatch::-webkit-color-swatch-wrapper { padding: 0; }
  input.legend-swatch::-webkit-color-swatch { border: none; border-radius: 50%; }
  .legend-name {
    font: inherit;
    font-size: 0.78rem;
    color: var(--ink);
    border: none;
    border-bottom: 1px dashed transparent;
    background: transparent;
    padding: 0;
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .legend-item.off .legend-name { color: var(--faint); }
  .legend-name:hover, .legend-name:focus { border-bottom-color: var(--muted); outline: none; }
  .legend-remove {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    padding: 0 2px;
    flex: none;
  }
  .legend-remove:hover { color: var(--coral); }
  .legend-add {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    font-family: inherit;
    text-align: left;
    padding: 4px;
    margin-top: 2px;
    border-radius: 3px;
  }
  .legend-add:hover { background: var(--hover); color: var(--accent); }

  /* ---- Trip stats (days + cost per country, totals) ---- */
  .stats { display: flex; flex-direction: column; gap: 1px; }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    column-gap: 10px;
    align-items: center;
    font-size: 0.78rem;
    padding: 3px 4px;
    border-radius: 3px;
    min-width: 0;
  }
  .stat-row:hover { background: var(--hover); }
  .stat-row.head { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-bottom: 2px; }
  .stat-row.head:hover { background: none; }
  .stat-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .stat-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
  .stat-num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; min-width: 2.2em; }
  .stat-num.cost { min-width: 4.4em; }
  /* Countries switched off in the calendar list drop out of the totals. */
  .stat-row.off .stat-name, .stat-row.off .stat-num { color: var(--faint); }
  .stat-row.off .stat-dot { opacity: 0.35; }
  .stat-row.group { margin-top: 5px; padding-top: 6px; border-top: 1px solid var(--line); border-radius: 0; }
  .stat-row.total .stat-num, .stat-row.total .stat-name { color: var(--ink); }
  .stat-empty { font-size: 0.75rem; color: var(--faint); padding: 3px 4px; }

  /* ==================== TOP BAR ==================== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  h1 { font-size: 0.95rem; font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  .badge {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--line-strong);
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .status { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Sidebar toggle — only shown when the sidebar is collapsed on narrow screens. */
  .hamburger { display: none; }
  .sidebar-backdrop { display: none; }

  /* ==================== TOOLBAR ==================== */
  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .tb-chunk { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .tb-chunk.right { justify-content: flex-end; }
  #rangeLabel {
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink);
    white-space: nowrap;
    padding: 4px 10px;
    text-align: center;
  }
  .tb-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 400;
    line-height: 1.2;
    padding: 5px 9px;
    border-radius: 3px;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .tb-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .tb-btn:disabled { opacity: 0.4; cursor: default; }
  .tb-btn[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .tb-btn.arrow { font-size: 1.1rem; padding: 2px 10px; }
  .week-nav { display: none; align-items: center; gap: 2px; }
  .week-nav.visible { display: flex; }

  /* ==================== MONTH GRID ==================== */
  .month-card { border-bottom: 1px solid var(--line); flex: none; }
  .month-card:last-child { border-bottom: none; }
  .month-title {
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink);
    margin: 0;
    padding: 8px 12px;
    text-align: center;
  }
  table { width: 100%; border-collapse: collapse; border-spacing: 0; table-layout: fixed; }
  th {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    padding: 8px 6px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  th:first-child { border-left: none; }
  th:last-child { border-right: none; }
  td {
    border: 1px solid var(--line);
    background: transparent;
    height: 76px;
    vertical-align: top;
    padding: 3px;
    position: relative;
  }
  tr td:first-child { border-left: none; }
  tr td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  td.clickable { cursor: pointer; transition: background 0.15s; }
  td.clickable:hover { background: var(--hover); }
  /* Days whose stay is booked: green fill at 25%, solid green frame
     (inset so collapsed borders don't shift; today's frame wins). */
  td.reserved { background: var(--reserved-tint); box-shadow: inset 0 0 0 1px var(--reserved-line); }
  td.reserved.clickable:hover { background: var(--reserved-tint-hover); }
  /* Days outside the month: blank cells, so the grid stays a clean 6x7. */
  td.other-month { background: transparent; }

  /* row-reverse puts the day number top-right while keeping it first in
     the DOM; the city tag sits top-left. */
  .day-top { display: flex; flex-direction: row-reverse; align-items: center; justify-content: space-between; gap: 4px; min-height: 22px; }
  .daynum {
    font-size: 0.9rem;
    color: var(--ink);
    padding: 2px 5px;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .citytag {
    font-size: 0.62rem;
    padding: 1px 6px;
    border-radius: 3px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 62%;
    margin-left: 3px;
  }

  /* Today: accent tint, 2px accent frame (inset so collapsed borders
     don't shift), a dot top-right, accent day number. */
  td.today { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--accent); }
  td.today .daynum { color: var(--accent); font-weight: 600; }
  td.today::before {
    content: '';
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    z-index: 1;
  }

  /* Entries are outlined chips in the country colour (--c), with a dot. */
  .entries { margin-top: 2px; font-size: 0.78rem; line-height: 1.3; padding: 0 2px; }
  .entry {
    --c: var(--accent);
    background: color-mix(in srgb, var(--c) 16%, var(--paper));
    border: 1px solid var(--c);
    color: var(--ink);
    border-radius: 3px;
    padding: 2px 6px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: flex-start;
    gap: 5px;
  }
  .entry::before {
    content: '';
    flex: none;
    width: 6px;
    height: 6px;
    margin-top: 0.42em; /* sits on the first text line even when the chip wraps */
    border-radius: 50%;
    background: var(--c);
  }
  .entry-text { overflow: hidden; text-overflow: ellipsis; white-space: inherit; }
  /* Booked entries carry a small green check after the text. */
  .entry-mark { flex: none; color: var(--reserved); font-size: 0.85em; margin-left: auto; padding-left: 4px; }
  .entry:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .more { color: var(--muted); font-size: 0.7rem; padding-left: 4px; }
  .entry[draggable="true"] { cursor: grab; }
  .entry[draggable="true"]:active { cursor: grabbing; }
  td.drop-target, .wv-col.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-tint); }

  /* Month view: 6 rows share the scroll area, so one month fills the
     screen; never below a usable minimum. */
  table.size-md td { height: calc((100vh - 130px) / 6); min-height: 96px; }
  table.size-md .citytag { font-size: 0.66rem; }

  /* ==================== WEEK VIEW (Outlook-style day columns) ==================== */
  .weekview { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .weekview-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--line-strong);
    flex: none;
  }
  .wv-col-head {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 7px;
    padding: 9px 6px;
    border-left: 1px solid var(--line);
    min-width: 0;
  }
  .wv-col-head:first-child { border-left: none; }
  .wv-dow { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .wv-date { font-size: 1.05rem; color: var(--ink); }
  /* Today's column header: date in a filled accent pill, like Outlook. */
  .wv-col-head.today .wv-dow { color: var(--accent); }
  .wv-col-head.today .wv-date {
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 50%;
    width: 1.7em;
    height: 1.7em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }
  .weekview-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .wv-col {
    border-left: 1px solid var(--line);
    padding: 6px 5px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-content: start;
  }
  .wv-col:first-child { border-left: none; }
  .wv-col.clickable { cursor: pointer; }
  .wv-col.clickable:hover { background: var(--hover); }
  .wv-col.reserved { background: var(--reserved-tint); box-shadow: inset 0 0 0 1px var(--reserved-line); }
  .wv-col.reserved.clickable:hover { background: var(--reserved-tint-hover); }
  .wv-col.today { background: var(--accent-tint); }
  .wv-col.today.clickable:hover { background: var(--accent-tint); }
  .wv-citytag {
    align-self: flex-start;
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 3px;
    color: #fff;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Week columns are tall, so chips wrap to full text instead of clipping. */
  .weekview .entry { white-space: normal; overflow: visible; text-overflow: unset; margin-bottom: 0; font-size: 0.78rem; }
  .weekview .entry-text { white-space: normal; overflow-wrap: anywhere; }

  /* ==================== NARROW SCREENS ==================== */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.open { transform: none; }
    /* Tap outside to close — the open drawer covers the toggle button. */
    .sidebar-backdrop.show {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 19;
      background: rgba(0,0,0,0.5);
    }
    .hamburger {
      display: block;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
    }
    .hamburger:hover { background: var(--hover); color: var(--ink); }
  }

  @media (max-width: 560px) {
    .toolbar { grid-template-columns: auto 1fr auto; padding: 4px; }
    #rangeLabel { font-size: 0.85rem; padding: 4px; white-space: normal; }
    .status { display: none; }
    td { padding: 2px; }
    .daynum { font-size: 0.8rem; }
    table.size-md td { height: 72px; min-height: 0; }
    table.size-md .entries { font-size: 0.68rem; }
    /* Week view becomes a vertical list of days. */
    .weekview-head { display: none; }
    .weekview-body { display: block; overflow-y: visible; }
    .wv-col { border-left: none; border-bottom: 1px solid var(--line); min-height: 84px; }
    .wv-col::before {
      content: attr(data-label);
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .wv-col.today::before { color: var(--accent); }
  }

  /* ==================== MODAL (day editor) ==================== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 30;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    max-width: 420px;
    width: 100%;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal h2 { font-size: 1rem; font-weight: 500; margin: 0 0 14px; color: var(--ink); }

  /* Mobile: modal becomes a bottom sheet, inputs stay 16px to stop iOS zoom */
  @media (max-width: 560px) {
    .overlay { align-items: flex-end; padding: 0; }
    .modal {
      max-width: none;
      border-radius: 0;
      border-bottom: none;
      max-height: 88vh;
      padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    }
    .modal ul { max-height: 42vh; }
    #tagRow { flex-wrap: wrap; }
    #tagRow input[type=text], #tagRow select,
    .modal input[type=text] { font-size: 16px; padding: 10px; }
    .modal li { padding: 10px 0; font-size: 0.95rem; }
    .modal li button { font-size: 1rem; padding: 4px 6px; }
    #addRow { gap: 10px; }
    .modal button.add { padding: 10px 16px; }
    .close-row button { padding: 9px 16px; font-size: 0.9rem; }
  }
  #tagRow input[type=text], #tagRow select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--paper); font-family: inherit; font-size: 0.85rem; color: var(--ink); }
  #tagRow input[type=text]:focus, #tagRow select:focus { outline: 2px solid var(--accent); }
  .reserved-toggle { display: flex; align-items: center; gap: 5px; flex: none; font-size: 0.8rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .reserved-toggle input { accent-color: var(--reserved); margin: 0; }
  .reserved-badge { margin-left: 8px; color: var(--reserved); border-color: var(--reserved); vertical-align: middle; }
  .modal li .entry-body { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .modal li input.entry-reserved { accent-color: var(--reserved); margin: 0; flex: none; }
  .modal li .entry-mark { margin-left: 0; }
  .modal ul { list-style: none; padding: 0; margin: 0 0 14px; max-height: 220px; overflow-y: auto; }
  .modal li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .modal li button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .modal li button:hover { color: var(--coral); }
  .entry-actions { display: flex; align-items: center; gap: 5px; flex: none; }
  .modal li button.edit-entry:hover, .modal li button.save-entry:hover { color: var(--accent); }
  .modal li button.cancel-entry:hover { color: var(--ink); }
  .entry-edit-input { min-width: 0; width: 100%; }
  .modal input[type=text] { flex: 1; padding: 8px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--paper); color: var(--ink); font-family: inherit; }
  .modal input[type=text]:focus { outline: 2px solid var(--accent); }
  .modal button.add { background: var(--accent); color: var(--on-accent); border: none; border-radius: 3px; padding: 8px 14px; cursor: pointer; font-family: inherit; }
  .modal button.add:hover { filter: brightness(1.12); }
  .close-row { text-align: right; margin-top: 12px; }
  .close-row button { background: none; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--muted); padding: 5px 12px; cursor: pointer; font-size: 0.8rem; font-family: inherit; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="mini-head">
        <button type="button" class="mini-nav" id="miniPrev" aria-label="Previous month">&lsaquo;</button>
        <span id="miniTitle"></span>
        <button type="button" class="mini-nav" id="miniNext" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>
    <div class="sidebar-section">
      <h2 class="sidebar-title">My calendars</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="sidebar-section">
      <h2 class="sidebar-title">Trip</h2>
      <div class="stats" id="stats"></div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button type="button" class="hamburger" id="sidebarToggle" aria-label="Toggle sidebar">&#9776;</button>
        <h1>Calendar</h1>
        <span class="badge" id="modeBadge">loading&hellip;</span>
      </div>
      <span class="status" id="status">Loading...</span>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="tb-chunk">
        <div class="week-nav" id="weekNav">
          <button id="prevBtn" class="tb-btn arrow" aria-label="Previous week">&lsaquo;</button>
          <button id="nextBtn" class="tb-btn arrow" aria-label="Next week">&rsaquo;</button>
        </div>
        <button id="todayBtn" class="tb-btn">Today</button>
      </div>
      <span id="rangeLabel"></span>
      <div class="tb-chunk right" role="tablist" aria-label="Calendar view">
        <button id="tripViewBtn" class="tb-btn" role="tab" aria-selected="true">Trip</button>
        <button id="weekViewBtn" class="tb-btn" role="tab" aria-selected="false">Week</button>
      </div>
    </div>
    <div class="months" id="months"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalDate"></h2>
    <div id="tagRow" style="display:flex; gap:8px; margin-bottom:14px;">
      <select id="countrySelect"></select>
      <input type="text" id="newCountryInput" placeholder="New country name" style="display:none;" autocomplete="off">
      <input type="text" id="cityInput" placeholder="City" autocomplete="off">
      <label class="reserved-toggle" title="Accommodation booked for this day"><input type="checkbox" id="reservedInput"> Reserved</label>
    </div>
    <ul id="entryList"></ul>
    <div id="addRow" style="display:flex; gap:8px;">
      <input type="text" id="entryInput" placeholder="Add something..." autocomplete="off">
      <button type="button" id="addBtn" class="add">Add</button>
    </div>
    <div class="close-row"><button id="closeModal">Close</button></div>
  </div>
</div>

<script>
// One page, two modes:
// - Edit mode: local server (server.js) is reachable at /data and /save.
//   Add/remove UI is shown, changes write straight to data.json on disk.
// - View mode (default when no local server, e.g. the public site):
//   reads data.json as a static file, no write UI at all.

// ============================================================
// CONFIG — the values you'll actually want to change live here.
// Everything below this block is behavior, not settings.
// ============================================================

// The trip's date range: one entry per month shown in the "trip" overview.
// month is 0-indexed (0 = January), so add/remove/edit entries to move
// or extend the trip. Order matters — keep it chronological.
const FIXED_MONTHS = [
  { year: 2026, month: 10 }, // November 2026
  { year: 2026, month: 11 }, // December 2026
  { year: 2027, month: 0 },  // January 2027
];

// Colors auto-assigned to new countries, in order, cycling once exhausted.
// Existing countries keep whatever color is already saved in data.json —
// this only applies the first time a country is added via "+ Add country".
const PLACEHOLDER_COLORS = ['#7a8f99', '#a97d5d', '#6b9b7a', '#9b6b8f', '#7d8f5d', '#5d7d8f'];

// Week view shows one week at a time (Outlook-style columns); prev/next
// step by a single week.
const WEEKS_PER_PAGE = 1;

// The sidebar "Trip" box splits the total cost between this many people.
const TRAVELLERS = 2;

// Costs are read straight out of entry text: any "<number> chf" it
// contains, e.g. "treno — 140 chf" or "Kyoto — Onyado — 486 chf; …".
const COST_RE = /(\d[\d'\u2019.,]*)\s*chf\b/gi;

// First day of the week: 0 = Sunday, 1 = Monday. Drives the month grid,
// the week view and the mini calendar alike — change this one number to
// switch the whole page over.
const WEEK_START_DOW = 1;

const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_MINI = ['S','M','T','W','T','F','S'];
// The 7 weekday indices in display order, rotated to WEEK_START_DOW.
const DOW_ORDER = Array.from({ length: 7 }, (_, i) => (WEEK_START_DOW + i) % 7);

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// ============================================================
// STATE
// ============================================================

let data = {}; // { "YYYY-MM-DD": [ "entry1", "entry2" ] }
let currentKey = null;
let dragPayload = null; // { fromKey, index } of the entry currently being dragged
let editable = false;

// Two views only: 'trip' (the fixed 3-month overview) and 'week' (one
// week as Outlook-style day columns). The Trip/Week toggle switches
// between them; the ‹ › arrows (week view only) step a week at a time.
let viewMode = 'trip';
const _now = new Date();
const TODAY_KEY = keyFor(_now.getFullYear(), _now.getMonth(), _now.getDate());
let weekStart = null;                  // Date — first day of the week shown in week view
// Countries switched off in the sidebar. Their days keep their number and
// stay clickable; only their tag and entries are hidden from the grid.
const hiddenCountries = new Set();
let miniMonth = null;                  // Date — the 1st of the month the mini calendar shows
let pendingFocusCountry = null;        // legend name to focus on the next renderLegend()

// ============================================================
// DOM REFERENCES
// ============================================================

const monthsEl = document.getElementById('months');
const rangeLabel = document.getElementById('rangeLabel');
const statusEl = document.getElementById('status');
const modeBadge = document.getElementById('modeBadge');
const overlay = document.getElementById('overlay');
const modalDate = document.getElementById('modalDate');
const entryList = document.getElementById('entryList');
const entryInput = document.getElementById('entryInput');
const addRow = document.getElementById('addRow');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const weekNav = document.getElementById('weekNav');
const todayBtn = document.getElementById('todayBtn');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const miniGrid = document.getElementById('miniGrid');
const miniTitle = document.getElementById('miniTitle');
const miniPrev = document.getElementById('miniPrev');
const miniNext = document.getElementById('miniNext');
const tripViewBtn = document.getElementById('tripViewBtn');
const weekViewBtn = document.getElementById('weekViewBtn');
const legendEl = document.getElementById('legend');
const statsEl = document.getElementById('stats');
const tagRow = document.getElementById('tagRow');
const countrySelect = document.getElementById('countrySelect');
const newCountryInput = document.getElementById('newCountryInput');
const cityInput = document.getElementById('cityInput');
const reservedInput = document.getElementById('reservedInput');

// ============================================================
// DATA MODEL HELPERS
// ============================================================

function pad(n) { return String(n).padStart(2,'0'); }
function keyFor(y,m,d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

// A day in data.json is either a plain array of entries (legacy) or
// { entries, country, city, reserved }. getDay() normalizes either shape.
// `reserved` means the stay is booked; the grid tints the whole day green.
function getDay(key) {
  const raw = data[key];
  if (!raw) return { entries: [], country: null, city: null, reserved: false };
  if (Array.isArray(raw)) return { entries: raw, country: null, city: null, reserved: false };
  return { entries: raw.entries || [], country: raw.country || null, city: raw.city || null, reserved: !!raw.reserved };
}

// An entry is a plain string, or { text, reserved: true } once it's booked.
// Everything that shows or edits an entry goes through these three.
function entryText(e) { return typeof e === 'string' ? e : (e && e.text) || ''; }
function entryReserved(e) { return !!(e && typeof e === 'object' && e.reserved); }
function makeEntry(text, reserved) { return reserved ? { text, reserved: true } : text; }

function setDayEntries(key, entries) {
  const day = getDay(key);
  if (entries.length === 0 && !day.country && !day.city && !day.reserved) {
    delete data[key];
    return;
  }
  const next = { entries };
  if (day.country) next.country = day.country;
  if (day.city) next.city = day.city;
  if (day.reserved) next.reserved = true;
  data[key] = next;
}

function setDayTag(key, country, city, reserved) {
  const day = getDay(key);
  if (day.entries.length === 0 && !country && !city && !reserved) {
    delete data[key];
    return;
  }
  const next = { entries: day.entries };
  if (country) next.country = country;
  if (city) next.city = city;
  if (reserved) next.reserved = true;
  data[key] = next;
}

function countryColor(name) {
  return (data._countries && data._countries[name]) || null;
}

// ============================================================
// PERSISTENCE — load & save
// ============================================================

// Try the local editor server first (short timeout so the public site
// doesn't hang waiting on a server that isn't there); fall back to
// reading the static data.json file read-only.
async function loadData() {
  statusEl.textContent = "Loading calendar...";
  try {
    const res = await fetch('/data', { signal: AbortSignal.timeout(800) });
    if (!res.ok) throw new Error('no local server');
    data = await res.json();
    editable = true;
    modeBadge.textContent = 'local editor';
    statusEl.textContent = "Loaded from data.json. Edits save straight to disk.";
  } catch (e) {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      data = await res.json();
    } catch (e2) {
      data = {};
    }
    editable = false;
    modeBadge.textContent = 'read-only';
    statusEl.textContent = "Read-only view. Editing happens locally.";
  }
  addRow.style.display = editable ? 'flex' : 'none';
  render();
}

async function saveData() {
  if (!editable) return;
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    statusEl.textContent = result.ok ? "Saved to data.json." : "Save failed: " + result.error;
  } catch (e) {
    statusEl.textContent = "Save failed, is server.js still running?";
  }
}

// ============================================================
// RENDERING — day cells & tables
// ============================================================

function buildWeekdayHeaderRow() {
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  DOW_ORDER.forEach(dow => {
    const th = document.createElement('th');
    th.textContent = DOW_SHORT[dow];
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  return thead;
}

// size: 'md' (single month, incl. trip overview), 'lg' (single week).
// A country switched off in the sidebar is hidden from the grid.
function isHidden(country) { return !!country && hiddenCountries.has(country); }

// One entry chip. Shared by the month cells and the week columns so both
// look and drag the same way.
function buildEntryChip(key, entry, idx, color) {
  const txt = entryText(entry);
  const e = document.createElement('div');
  e.className = 'entry';
  const label = document.createElement('span');
  label.className = 'entry-text';
  label.textContent = txt;
  e.appendChild(label);
  if (entryReserved(entry)) {
    e.classList.add('reserved');
    e.appendChild(buildReservedMark());
  }
  if (color) e.style.setProperty('--c', color);
  if (editable) {
    e.draggable = true;
    e.addEventListener('dragstart', (ev) => {
      dragPayload = { fromKey: key, index: idx };
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', txt);
      ev.stopPropagation();
    });
    e.addEventListener('dragend', () => { dragPayload = null; });
  }
  return e;
}

// The small green check that marks a booked entry.
function buildReservedMark() {
  const mark = document.createElement('span');
  mark.className = 'entry-mark';
  mark.textContent = '\u2713';
  mark.title = 'Reserved';
  return mark;
}

// Click-to-open plus drag-and-drop of entries between days. Shared by the
// month cells (td) and the week columns (div).
function attachDayInteractions(el, key, hasEntries) {
  if (editable || hasEntries) {
    el.classList.add('clickable');
    el.addEventListener('click', () => openModal(key));
  }
  if (!editable) return;
  el.addEventListener('dragover', (ev) => {
    if (!dragPayload) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-target');
  });
  el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
  el.addEventListener('drop', async (ev) => {
    ev.preventDefault();
    el.classList.remove('drop-target');
    if (!dragPayload) return;
    const { fromKey, index } = dragPayload;
    dragPayload = null;
    if (fromKey === key) return;
    const fromEntries = getDay(fromKey).entries.slice();
    const moved = fromEntries.splice(index, 1)[0];
    if (moved === undefined) return;
    setDayEntries(fromKey, fromEntries);
    const toEntries = getDay(key).entries.slice();
    toEntries.push(moved);
    setDayEntries(key, toEntries);
    await saveData();
    render();
  });
}

function buildDayCell(key, dayNum, size) {
  const td = document.createElement('td');
  td.dataset.key = key;
  if (key === TODAY_KEY) td.classList.add('today');
  const day = getDay(key);

  const topRow = document.createElement('div');
  topRow.className = 'day-top';
  const num = document.createElement('span');
  num.className = 'daynum';
  if (size === 'lg') {
    const [yy, mm, dd] = key.split('-').map(Number);
    const wd = new Date(yy, mm - 1, dd).toLocaleDateString('en-US', { weekday: 'short' });
    num.textContent = `${wd} ${dayNum}`;
  } else {
    num.textContent = dayNum;
  }
  topRow.appendChild(num);

  const muteDay = isHidden(day.country);
  const entryColor = day.country ? countryColor(day.country) : null;
  if (day.reserved && !muteDay) td.classList.add('reserved');
  if (day.country && !muteDay) {
    td.title = day.city ? `${day.country} — ${day.city}` : day.country;
    if (day.city) {
      const tag = document.createElement('span');
      tag.className = 'citytag';
      tag.textContent = day.city;
      tag.style.background = entryColor || 'var(--muted)';
      topRow.appendChild(tag);
    }
  }
  td.appendChild(topRow);

  const entries = muteDay ? [] : day.entries;
  const maxShown = size === 'lg' ? entries.length : (size === 'md' ? 4 : 2);
  const entriesDiv = document.createElement('div');
  entriesDiv.className = 'entries';
  entries.slice(0, maxShown).forEach((entry, idx) => {
    entriesDiv.appendChild(buildEntryChip(key, entry, idx, entryColor));
  });
  if (entries.length > maxShown) {
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = `+${entries.length - maxShown} more`;
    entriesDiv.appendChild(more);
  }
  td.appendChild(entriesDiv);
  attachDayInteractions(td, key, entries.length > 0);
  return td;
}

function buildMonthTable(year, month, size) {
  const first = new Date(year, month, 1);
  // Columns before the 1st, given the configured first day of the week.
  const startDow = (first.getDay() - WEEK_START_DOW + 7) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const container = document.createElement('div');
  container.className = 'month-card';
  const title = document.createElement('h3');
  title.className = 'month-title';
  title.textContent = `${MONTH_NAMES[month]} ${year}`;
  container.appendChild(title);

  const table = document.createElement('table');
  table.className = 'size-' + size;
  table.appendChild(buildWeekdayHeaderRow());

  const tbody = document.createElement('tbody');
  // Always 6 rows so every month is the same height; cells outside the
  // month show the neighbouring month's day number, faint (like TaskNotes).
  for (let row = 0; row < 6; row++) {
    const tr = document.createElement('tr');
    for (let dow = 0; dow < 7; dow++) {
      const offset = row * 7 + dow - startDow; // 0 = the 1st of this month
      if (offset < 0 || offset >= daysInMonth) {
        // Outside this month: the cell stays so the 6x7 grid keeps its
        // shape, but it's left blank — no day number to misread.
        const td = document.createElement('td');
        td.className = 'empty other-month';
        tr.appendChild(td);
      } else {
        tr.appendChild(buildDayCell(keyFor(year, month, 1 + offset), 1 + offset, size));
      }
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
  return container;
}

function formatWeekRange(start, end) {
  const y1 = start.getFullYear(), y2 = end.getFullYear();
  const m1 = start.getMonth(), m2 = end.getMonth();
  if (y1 === y2 && m1 === m2) {
    return `${MONTH_NAMES[m1]} ${start.getDate()}–${end.getDate()}, ${y1}`;
  }
  if (y1 === y2) {
    return `${MONTH_NAMES[m1]} ${start.getDate()} – ${MONTH_NAMES[m2]} ${end.getDate()}, ${y1}`;
  }
  return `${MONTH_NAMES[m1]} ${start.getDate()}, ${y1} – ${MONTH_NAMES[m2]} ${end.getDate()}, ${y2}`;
}

// Week view, Outlook-style: seven full-height day columns under a header
// row of weekday + date. Entries have no clock times in this calendar,
// so there's no hour gutter — each column just lists its day.
function buildWeekView(start) {
  const container = document.createElement('div');
  container.className = 'weekview';

  const head = document.createElement('div');
  head.className = 'weekview-head';
  const body = document.createElement('div');
  body.className = 'weekview-body';

  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const key = keyFor(d.getFullYear(), d.getMonth(), d.getDate());
    const day = getDay(key);
    const isToday = key === TODAY_KEY;
    const muteDay = isHidden(day.country);
    const color = day.country ? countryColor(day.country) : null;

    const ch = document.createElement('div');
    ch.className = 'wv-col-head' + (isToday ? ' today' : '');
    const dow = document.createElement('span');
    dow.className = 'wv-dow';
    dow.textContent = DOW_SHORT[d.getDay()];
    const date = document.createElement('span');
    date.className = 'wv-date';
    date.textContent = d.getDate();
    ch.appendChild(dow);
    ch.appendChild(date);
    head.appendChild(ch);

    const col = document.createElement('div');
    col.className = 'wv-col' + (isToday ? ' today' : '');
    if (day.reserved && !muteDay) col.classList.add('reserved');
    col.dataset.key = key;
    col.dataset.label = `${DOW_SHORT[d.getDay()]} ${d.getDate()}`;

    if (day.country && !muteDay) {
      col.title = day.city ? `${day.country} — ${day.city}` : day.country;
      if (day.city) {
        const tag = document.createElement('div');
        tag.className = 'wv-citytag';
        tag.textContent = day.city;
        tag.style.background = color || 'var(--muted)';
        col.appendChild(tag);
      }
    }

    const entries = muteDay ? [] : day.entries;
    entries.forEach((entry, idx) => col.appendChild(buildEntryChip(key, entry, idx, color)));

    attachDayInteractions(col, key, entries.length > 0);
    body.appendChild(col);
  }

  container.appendChild(head);
  container.appendChild(body);
  return container;
}

// ============================================================
// LEGEND (country tags)
// ============================================================

// Renames a country everywhere: the legend entry and every day tagged
// with it. Returns false (no-op) on an empty name or a collision with
// an existing country.
function renameCountry(oldName, newName) {
  newName = newName.trim();
  if (!newName || newName === oldName) return false;
  if (data._countries[newName]) return false;

  const color = data._countries[oldName];
  delete data._countries[oldName];
  data._countries[newName] = color;

  Object.keys(data).forEach(key => {
    if (key === '_countries') return;
    const day = data[key];
    if (day && !Array.isArray(day) && day.country === oldName) {
      day.country = newName;
    }
  });
  return true;
}

// Removes a country from the legend and clears its tag (country + city)
// from any day that used it, rather than leaving a dangling reference.
function removeCountry(name) {
  delete data._countries[name];
  Object.keys(data).forEach(key => {
    if (key === '_countries') return;
    const day = data[key];
    if (day && !Array.isArray(day) && day.country === name) {
      delete day.country;
      delete day.city;
    }
  });
}

function addCountry() {
  const base = 'New country';
  let name = base, n = 1;
  while (data._countries[name]) { n++; name = `${base} ${n}`; }
  const used = Object.keys(data._countries).length;
  data._countries[name] = PLACEHOLDER_COLORS[used % PLACEHOLDER_COLORS.length];
  return name;
}

// The sidebar "My calendars" list: one row per country, with a coloured
// checkbox that shows/hides that country's days in the grid.
function renderLegend() {
  legendEl.innerHTML = '';
  const countries = data._countries || {};
  const justAdded = pendingFocusCountry;
  pendingFocusCountry = null;

  Object.keys(countries).forEach(name => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const color = countries[name];
    if (color) item.style.setProperty('--c', color);
    const on = !hiddenCountries.has(name);
    if (!on) item.classList.add('off');

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'legend-check';
    check.checked = on;
    check.title = on ? `Hide ${name}` : `Show ${name}`;
    check.addEventListener('change', () => {
      if (check.checked) hiddenCountries.delete(name);
      else hiddenCountries.add(name);
      render();
    });
    item.appendChild(check);

    if (editable) {
      const swatch = document.createElement('input');
      swatch.type = 'color';
      swatch.className = 'legend-swatch';
      swatch.value = color || '#888888';
      swatch.title = `Recolor ${name}`;
      swatch.addEventListener('change', async () => {
        data._countries[name] = swatch.value;
        await saveData();
        render();
      });
      item.appendChild(swatch);

      const label = document.createElement('input');
      label.type = 'text';
      label.className = 'legend-name';
      label.value = name;
      label.addEventListener('change', async () => {
        const ok = renameCountry(name, label.value);
        if (!ok) { label.value = name; return; }
        // Keep the filter pointed at the renamed country.
        if (hiddenCountries.delete(name)) hiddenCountries.add(label.value.trim());
        await saveData();
        render();
      });
      label.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); label.blur(); }
      });
      item.appendChild(label);
      if (name === justAdded) { label.focus(); label.select(); }

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'legend-remove';
      removeBtn.textContent = '×';
      removeBtn.title = `Remove ${name}`;
      removeBtn.addEventListener('click', async () => {
        if (!confirm(`Remove "${name}"? Days tagged with it will become untagged.`)) return;
        removeCountry(name);
        hiddenCountries.delete(name);
        await saveData();
        render();
      });
      item.appendChild(removeBtn);
    } else {
      const label = document.createElement('span');
      label.className = 'legend-name';
      label.textContent = name;
      item.appendChild(label);
    }

    legendEl.appendChild(item);
  });

  if (editable) {
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'legend-add';
    addBtn.textContent = '+ Add country';
    addBtn.addEventListener('click', async () => {
      pendingFocusCountry = addCountry();
      await saveData();
      render();
    });
    legendEl.appendChild(addBtn);
  }
}

// ============================================================
// TRIP STATS (sidebar)
// ============================================================

// Sum of every "<number> chf" in one entry's text. Accepts Swiss and
// Italian spellings: 1'200 / 1’200 / 1.200 (thousands), 40,5 (decimals).
function entryCost(txt) {
  let total = 0;
  for (const m of String(txt).matchAll(COST_RE)) {
    let n = m[1].replace(/['\u2019]/g, '');
    if (/^\d{1,3}(\.\d{3})+$/.test(n)) n = n.replace(/\./g, '');
    const v = parseFloat(n.replace(',', '.'));
    if (Number.isFinite(v)) total += v;
  }
  return total;
}

// Days and cost per country, in the order the countries appear in the
// trip, plus how much of each is already booked: reservedDays counts
// days flagged reserved, reservedCost sums the entries flagged reserved.
// Untagged days have no country to sit under, but any cost they carry
// still belongs to the trip, so they get an "Untagged" bucket.
function tripStats() {
  const rows = new Map();
  Object.keys(data)
    .filter(k => k !== '_countries')
    .sort()
    .forEach(key => {
      const day = getDay(key);
      let cost = 0, reservedCost = 0;
      day.entries.forEach(e => {
        const c = entryCost(entryText(e));
        cost += c;
        if (entryReserved(e)) reservedCost += c;
      });
      if (!day.country && cost === 0) return;
      const name = day.country || '';
      const row = rows.get(name) || { name, days: 0, cost: 0, reservedDays: 0, reservedCost: 0 };
      if (day.country) row.days++;
      if (day.country && day.reserved) row.reservedDays++;
      row.cost += cost;
      row.reservedCost += reservedCost;
      rows.set(name, row);
    });
  return [...rows.values()];
}

function formatChf(v) {
  return v.toLocaleString('de-CH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function buildStatRow(label, days, cost, opts = {}) {
  const row = document.createElement('div');
  row.className = 'stat-row' + (opts.className ? ' ' + opts.className : '');
  const name = document.createElement('span');
  name.className = 'stat-name';
  if (opts.color !== undefined) {
    const dot = document.createElement('span');
    dot.className = 'stat-dot';
    if (opts.color) dot.style.setProperty('--c', opts.color);
    name.appendChild(dot);
  }
  const text = document.createElement('span');
  text.className = 'stat-label';
  text.textContent = label;
  name.appendChild(text);
  name.title = opts.title || label;
  const d = document.createElement('span');
  d.className = 'stat-num';
  d.textContent = days;
  const c = document.createElement('span');
  c.className = 'stat-num cost';
  c.textContent = cost;
  row.append(name, d, c);
  return row;
}

// The sidebar "Trip" box: one row per country (days there, CHF spent
// there); then what's booked vs. still to book; then the trip total,
// the per-person share and the average per day. Countries switched off
// in "My calendars" stay listed but leave the totals, so the box always
// agrees with what the grid is showing.
function renderStats() {
  statsEl.innerHTML = '';
  const rows = tripStats();
  if (rows.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'stat-empty';
    empty.textContent = 'No tagged days yet.';
    statsEl.appendChild(empty);
    return;
  }

  statsEl.appendChild(buildStatRow('', 'days', 'chf', { className: 'head' }));

  let totalDays = 0, totalCost = 0, reservedDays = 0, reservedCost = 0;
  rows.forEach(r => {
    const off = r.name && isHidden(r.name);
    if (!off) {
      totalDays += r.days; totalCost += r.cost;
      reservedDays += r.reservedDays; reservedCost += r.reservedCost;
    }
    statsEl.appendChild(buildStatRow(
      r.name || 'Untagged',
      r.name ? r.days : '–',
      r.cost ? formatChf(r.cost) : '–',
      { color: r.name ? countryColor(r.name) : null, className: off ? 'off' : '' }
    ));
  });

  statsEl.appendChild(buildStatRow('Reserved', reservedDays, formatChf(reservedCost), {
    className: 'group', color: 'var(--reserved)', title: 'Days with the stay booked, and CHF of booked entries'
  }));
  statsEl.appendChild(buildStatRow('To book', '', formatChf(totalCost - reservedCost), {
    title: 'CHF of entries not yet booked'
  }));

  statsEl.appendChild(buildStatRow('Total', totalDays, formatChf(totalCost), { className: 'group total' }));
  statsEl.appendChild(buildStatRow('Per person', '', formatChf(totalCost / TRAVELLERS), {
    className: 'total', title: `Total split between ${TRAVELLERS} people`
  }));
  const perDay = totalDays ? totalCost / totalDays : 0;
  statsEl.appendChild(buildStatRow('Per day', '', totalDays ? formatChf(Math.round(perDay)) : '–', {
    className: 'total', title: 'Total divided by the number of days'
  }));
  statsEl.appendChild(buildStatRow('Per day each', '', totalDays ? formatChf(Math.round(perDay / TRAVELLERS)) : '–', {
    className: 'total', title: `Per day, split between ${TRAVELLERS} people`
  }));
}

// ============================================================
// MINI CALENDAR (sidebar)
// ============================================================

// Always 6 rows so the sidebar doesn't jump height between months.
function renderMini() {
  if (!miniMonth) miniMonth = new Date(FIXED_MONTHS[0].year, FIXED_MONTHS[0].month, 1);
  const y = miniMonth.getFullYear();
  const m = miniMonth.getMonth();
  miniTitle.textContent = `${MONTH_NAMES[m]} ${y}`;
  miniGrid.innerHTML = '';

  DOW_ORDER.forEach(dow => {
    const h = document.createElement('div');
    h.className = 'mini-dow';
    h.textContent = DOW_MINI[dow];
    miniGrid.appendChild(h);
  });

  // Highlight the week the main view is showing (week view only — in trip
  // view whole months are on screen, so a highlight says nothing).
  let viewFrom = null, viewTo = null;
  if (viewMode === 'week' && weekStart) {
    viewFrom = new Date(weekStart);
    viewTo = new Date(weekStart);
    viewTo.setDate(viewTo.getDate() + 6);
  }

  const startDow = (new Date(y, m, 1).getDay() - WEEK_START_DOW + 7) % 7;
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 + i - startDow);
    const key = keyFor(d.getFullYear(), d.getMonth(), d.getDate());
    const day = getDay(key);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mini-day';
    btn.textContent = d.getDate();
    if (d.getMonth() !== m) btn.classList.add('out');
    if (key === TODAY_KEY) btn.classList.add('today');
    if (viewFrom && d >= viewFrom && d <= viewTo) btn.classList.add('in-view');
    if ((day.entries.length > 0 || day.country) && !isHidden(day.country)) {
      btn.classList.add('has-data');
    }
    btn.addEventListener('click', () => goToDate(d));
    miniGrid.appendChild(btn);
  }
}

// Point the main view at a date: jump to its week in week view, or scroll
// to its cell in trip view.
function goToDate(d) {
  miniMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  setSidebar(false);
  if (viewMode === 'week') {
    weekStart = clampBlockStart(weekStartOf(d));
    render();
    return;
  }
  renderMini();
  const key = keyFor(d.getFullYear(), d.getMonth(), d.getDate());
  const cell = monthsEl.querySelector(`td[data-key="${key}"]`);
  if (cell) cell.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// ============================================================
// TRIP RANGE & WEEK NAVIGATION
// ============================================================

// Start of the week containing a date (per WEEK_START_DOW), at local midnight.
function weekStartOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - WEEK_START_DOW + 7) % 7));
  return d;
}

const TRIP_FIRST_WEEK = weekStartOf(new Date(FIXED_MONTHS[0].year, FIXED_MONTHS[0].month, 1));
const LAST_MONTH = FIXED_MONTHS[FIXED_MONTHS.length - 1];
const TRIP_LAST_WEEK = weekStartOf(new Date(LAST_MONTH.year, LAST_MONTH.month + 1, 0));

// Week view shows a block of WEEKS_PER_PAGE consecutive weeks starting at
// weekStart. The block can't slide past the trip's range, so the latest
// valid start is however many weeks before TRIP_LAST_WEEK the block is long.
const MAX_BLOCK_START = (() => {
  const d = new Date(TRIP_LAST_WEEK);
  d.setDate(d.getDate() - (WEEKS_PER_PAGE - 1) * 7);
  return d;
})();

function clampBlockStart(d) {
  if (d < TRIP_FIRST_WEEK) return new Date(TRIP_FIRST_WEEK);
  if (d > MAX_BLOCK_START) return new Date(MAX_BLOCK_START);
  return d;
}

function render() {
  monthsEl.innerHTML = '';
  renderLegend();
  renderStats();

  if (viewMode === 'week') {
    if (!weekStart) weekStart = new Date(TRIP_FIRST_WEEK);
    monthsEl.appendChild(buildWeekView(weekStart));
    const end = new Date(weekStart);
    end.setDate(end.getDate() + 6);
    rangeLabel.textContent = formatWeekRange(weekStart, end);
  } else {
    FIXED_MONTHS.forEach(({ year, month }) => {
      monthsEl.appendChild(buildMonthTable(year, month, 'md'));
    });
    const a = FIXED_MONTHS[0], b = FIXED_MONTHS[FIXED_MONTHS.length - 1];
    rangeLabel.textContent = `${MONTH_NAMES[a.month]} ${a.year} – ${MONTH_NAMES[b.month]} ${b.year}`;
  }
  renderMini();
  updateToolbar();
}

function updateToolbar() {
  const week = viewMode === 'week';
  tripViewBtn.setAttribute('aria-selected', String(!week));
  weekViewBtn.setAttribute('aria-selected', String(week));
  weekNav.classList.toggle('visible', week);
  prevBtn.disabled = week && weekStart <= TRIP_FIRST_WEEK;
  nextBtn.disabled = week && weekStart >= MAX_BLOCK_START;
  // Today is only reachable when it falls inside the trip's date range.
  const inRange = _now >= TRIP_FIRST_WEEK && _now <= new Date(MAX_BLOCK_START.getTime() + WEEKS_PER_PAGE * 7 * 86400000);
  todayBtn.disabled = !inRange;
}

function goToToday() {
  miniMonth = new Date(_now.getFullYear(), _now.getMonth(), 1);
  if (viewMode === 'week') {
    weekStart = clampBlockStart(weekStartOf(_now));
    render();
  } else {
    renderMini();
  }
  const cell = monthsEl.querySelector('.today');
  if (cell) cell.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function setViewMode(mode) {
  if (mode === viewMode) return;
  if (mode === 'week' && !weekStart) {
    // Open on the week the mini calendar is showing, or today's week if
    // that falls inside the trip; otherwise the trip's first week.
    const seed = (_now >= TRIP_FIRST_WEEK && _now <= TRIP_LAST_WEEK) ? _now : (miniMonth || TRIP_FIRST_WEEK);
    weekStart = clampBlockStart(weekStartOf(seed));
  }
  viewMode = mode;
  miniMonth = viewMode === 'week'
    ? new Date(weekStart.getFullYear(), weekStart.getMonth(), 1)
    : miniMonth;
  render();
  // The scroll region is the calendar pane, not the page.
  monthsEl.scrollTo({ top: 0, behavior: 'smooth' });
}

// direction: -1 (prev) or +1 (next) — steps one week in week view.
function shiftWeekBlock(direction) {
  if (viewMode !== 'week') return;
  const next = new Date(weekStart);
  next.setDate(next.getDate() + direction * WEEKS_PER_PAGE * 7);
  weekStart = clampBlockStart(next);
  miniMonth = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);
  render();
}

tripViewBtn.addEventListener('click', () => setViewMode('trip'));
weekViewBtn.addEventListener('click', () => setViewMode('week'));
prevBtn.addEventListener('click', () => shiftWeekBlock(-1));
nextBtn.addEventListener('click', () => shiftWeekBlock(1));
todayBtn.addEventListener('click', goToToday);
function setSidebar(open) {
  sidebar.classList.toggle('open', open);
  sidebarBackdrop.classList.toggle('show', open);
}
sidebarToggle.addEventListener('click', () => setSidebar(!sidebar.classList.contains('open')));
sidebarBackdrop.addEventListener('click', () => setSidebar(false));
miniPrev.addEventListener('click', () => {
  miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() - 1, 1);
  renderMini();
});
miniNext.addEventListener('click', () => {
  miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() + 1, 1);
  renderMini();
});
document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('open')) return;
  if (e.key === 'Escape' && sidebar.classList.contains('open')) { setSidebar(false); return; }
  if (e.key === 'Escape' && viewMode === 'week') setViewMode('trip');
});

// ============================================================
// MODAL — day editor (entries + country/city tag)
// ============================================================

function openModal(key) {
  currentKey = key;
  const day = getDay(key);
  renderModalTitle(key);

  tagRow.style.display = editable ? 'flex' : 'none';
  if (editable) {
    countrySelect.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '— none —';
    countrySelect.appendChild(noneOpt);
    Object.keys(data._countries || {}).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      countrySelect.appendChild(opt);
    });
    const newOpt = document.createElement('option');
    newOpt.value = '__new__';
    newOpt.textContent = '+ New country…';
    countrySelect.appendChild(newOpt);

    countrySelect.value = day.country || '';
    newCountryInput.style.display = 'none';
    newCountryInput.value = '';
    cityInput.value = day.city || '';
    reservedInput.checked = day.reserved;
  }

  renderEntryList();
  overlay.classList.add('open');
  if (editable) {
    entryInput.value = '';
    entryInput.focus();
  }
}

// Date heading, with a green "reserved" badge when the day's stay is booked.
function renderModalTitle(key) {
  const [y,m,d] = key.split('-').map(Number);
  modalDate.textContent = `${MONTH_NAMES[m-1]} ${d}, ${y}`;
  if (getDay(key).reserved) {
    const badge = document.createElement('span');
    badge.className = 'badge reserved-badge';
    badge.textContent = 'reserved';
    modalDate.appendChild(badge);
  }
}

async function saveTag(newCountryName) {
  if (!editable || !currentKey) return;
  let country = newCountryName !== undefined ? newCountryName : countrySelect.value;
  if (country === '__new__') return; // waiting on the new-name input, nothing to save yet
  if (country && !data._countries[country]) {
    const used = Object.keys(data._countries).length;
    data._countries[country] = PLACEHOLDER_COLORS[used % PLACEHOLDER_COLORS.length];
  }
  setDayTag(currentKey, country, cityInput.value.trim(), reservedInput.checked);
  await saveData();
  render();
  renderModalTitle(currentKey);
}

countrySelect.addEventListener('change', () => {
  if (countrySelect.value === '__new__') {
    newCountryInput.style.display = 'block';
    newCountryInput.value = '';
    newCountryInput.focus();
  } else {
    newCountryInput.style.display = 'none';
    saveTag();
  }
});
newCountryInput.addEventListener('change', () => {
  const name = newCountryInput.value.trim();
  if (!name) return;
  saveTag(name);
});
newCountryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    newCountryInput.blur();
  }
});
cityInput.addEventListener('change', () => saveTag());
reservedInput.addEventListener('change', () => saveTag());
cityInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    cityInput.blur();
  }
});

function renderEntryList() {
  entryList.innerHTML = '';
  const entries = getDay(currentKey).entries;
  if (entries.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Nothing yet.';
    li.style.color = 'var(--muted)';
    entryList.appendChild(li);
  }
  entries.forEach((entry, idx) => {
    const txt = entryText(entry);
    const reserved = entryReserved(entry);
    const li = document.createElement('li');
    const body = document.createElement('div');
    body.className = 'entry-body';
    if (editable) {
      // Tick to mark this booking as done; the cost then counts as reserved.
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'entry-reserved';
      check.checked = reserved;
      check.title = reserved ? 'Reserved — untick to mark as not booked' : 'Mark as reserved';
      check.addEventListener('change', async () => {
        const updated = getDay(currentKey).entries.slice();
        updated[idx] = makeEntry(txt, check.checked);
        setDayEntries(currentKey, updated);
        await saveData();
        renderEntryList();
        render();
      });
      body.appendChild(check);
    } else if (reserved) {
      body.appendChild(buildReservedMark());
    }
    const span = document.createElement('span');
    span.textContent = txt;
    body.appendChild(span);
    li.appendChild(body);
    if (editable) {
      const actions = document.createElement('div');
      actions.className = 'entry-actions';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'edit-entry';
      editBtn.textContent = 'edit';
      editBtn.addEventListener('click', () => startEditingEntry(li, span, actions, idx, txt));
      actions.appendChild(editBtn);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-entry';
      removeBtn.textContent = 'remove';
      removeBtn.addEventListener('click', async () => {
        const updated = entries.slice();
        updated.splice(idx, 1);
        setDayEntries(currentKey, updated);
        await saveData();
        renderEntryList();
        render();
      });
      actions.appendChild(removeBtn);
      li.appendChild(actions);
    }
    entryList.appendChild(li);
  });
}

function startEditingEntry(li, span, actions, idx, originalText) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'entry-edit-input';
  input.value = originalText;
  input.setAttribute('aria-label', 'Edit calendar entry');
  span.parentNode.replaceChild(input, span);
  actions.innerHTML = '';

  const finish = async (save) => {
    const value = input.value.trim();
    if (save && value && value !== originalText) {
      const updated = getDay(currentKey).entries.slice();
      // Editing the text keeps the entry's reserved flag.
      updated[idx] = makeEntry(value, entryReserved(updated[idx]));
      setDayEntries(currentKey, updated);
      await saveData();
      render();
    }
    renderEntryList();
  };

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'save-entry';
  saveBtn.textContent = 'save';
  saveBtn.addEventListener('click', () => finish(true));
  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'cancel-entry';
  cancelBtn.textContent = 'cancel';
  cancelBtn.addEventListener('click', () => finish(false));
  actions.append(saveBtn, cancelBtn);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.focus();
  input.select();
}

async function addEntry() {
  if (!editable) return;
  const val = entryInput.value.trim();
  if (!val || !currentKey) return;
  const entries = getDay(currentKey).entries.slice();
  entries.push(val);
  setDayEntries(currentKey, entries);
  entryInput.value = '';
  await saveData();
  renderEntryList();
  render();
}

document.getElementById('addBtn').addEventListener('click', addEntry);
entryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addEntry();
  }
});

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('open');
});

// ============================================================
// INIT
// ============================================================

loadData();
</script>
