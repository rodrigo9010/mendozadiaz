<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Editor (local)</title>
<style>
  :root {
    --ink: #1c2b2d;
    --paper: #f6f3ea;
    --line: #d8d0bd;
    --teal: #2f5c58;
    --coral: #c85f42;
    --muted: #8a8577;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 80px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: 0.02em; }
  .badge {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--coral);
    color: var(--paper);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
  }
  .nav button {
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .nav button:hover { background: var(--ink); color: var(--paper); }
  .months { display: grid; grid-template-columns: 1fr; gap: 40px; }
  @media (min-width: 780px) { .months { grid-template-columns: 1fr 1fr; } }
  .month-title { font-size: 1.15rem; margin: 0 0 10px; font-weight: bold; color: var(--teal); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: normal;
    padding-bottom: 6px;
  }
  td {
    border: 1px solid var(--line);
    height: 76px;
    vertical-align: top;
    padding: 4px;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }
  td:hover { background: rgba(47,92,88,0.06); }
  td.empty { cursor: default; background: transparent; border-color: transparent; }
  td.empty:hover { background: transparent; }
  .daynum { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.7rem; color: var(--muted); }
  .entries { margin-top: 2px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.68rem; line-height: 1.3; }
  .entry {
    background: var(--coral);
    color: var(--paper);
    border-radius: 3px;
    padding: 1px 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .more { color: var(--teal); font-size: 0.62rem; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,43,45,0.55);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    max-width: 420px;
    width: 100%;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .modal h2 { font-family: Georgia, serif; font-size: 1.1rem; margin: 0 0 14px; }
  .modal ul { list-style: none; padding: 0; margin: 0 0 14px; max-height: 220px; overflow-y: auto; }
  .modal li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .modal li button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .modal li button:hover { color: var(--coral); }
  .modal input[type=text] { flex: 1; padding: 8px; border: 1px solid var(--line); background: white; font-family: inherit; }
  .modal input[type=text]:focus { outline: 2px solid var(--teal); }
  .modal button.add { background: var(--teal); color: var(--paper); border: none; padding: 8px 14px; cursor: pointer; }
  .modal button.add:hover { background: var(--ink); }
  .close-row { text-align: right; margin-top: 12px; }
  .close-row button { background: none; border: 1px solid var(--muted); color: var(--muted); padding: 5px 12px; cursor: pointer; font-size: 0.8rem; }
  .status { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.7rem; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <h1>Calendario</h1>
      <span class="badge">local editor</span>
    </div>
    <div class="nav">
      <button id="prev">&larr; prev</button>
      <span id="rangeLabel"></span>
      <button id="next">next &rarr;</button>
    </div>
  </header>
  <div class="months" id="months"></div>
  <div class="status" id="status">Loading...</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalDate"></h2>
    <ul id="entryList"></ul>
    <div style="display:flex; gap:8px;">
      <input type="text" id="entryInput" placeholder="Add something..." autocomplete="off">
      <button type="button" id="addBtn" class="add">Add</button>
    </div>
    <div class="close-row"><button id="closeModal">Close</button></div>
  </div>
</div>

<script>
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let baseYear = new Date().getFullYear();
let baseMonth = new Date().getMonth();

let data = {}; // { "YYYY-MM-DD": [ "entry1", "entry2" ] }
let currentKey = null;

const monthsEl = document.getElementById('months');
const rangeLabel = document.getElementById('rangeLabel');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const modalDate = document.getElementById('modalDate');
const entryList = document.getElementById('entryList');
const entryInput = document.getElementById('entryInput');

function pad(n) { return String(n).padStart(2,'0'); }
function keyFor(y,m,d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

// --- talking to server.js instead of window.storage ---

async function loadData() {
  statusEl.textContent = "Loading data.json from local server...";
  try {
    const res = await fetch('/data');
    data = await res.json();
    statusEl.textContent = "Loaded from data.json. Edits save straight to disk.";
  } catch (e) {
    data = {};
    statusEl.textContent = "Could not reach local server. Is server.js running?";
  }
  render();
}

async function saveData() {
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    statusEl.textContent = result.ok ? "Saved to data.json." : "Save failed: " + result.error;
  } catch (e) {
    statusEl.textContent = "Save failed, is server.js still running?";
  }
}

// --- calendar rendering (same as before) ---

function buildMonthTable(year, month) {
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const container = document.createElement('div');
  const title = document.createElement('h3');
  title.className = 'month-title';
  title.textContent = `${MONTH_NAMES[month]} ${year}`;
  container.appendChild(title);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
    const th = document.createElement('th');
    th.textContent = d;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  let day = 1;
  let started = false;
  for (let row = 0; row < 6 && day <= daysInMonth; row++) {
    const tr = document.createElement('tr');
    for (let dow = 0; dow < 7; dow++) {
      const td = document.createElement('td');
      if (!started && dow === startDow) started = true;
      if (!started || day > daysInMonth) {
        td.className = 'empty';
      } else {
        const key = keyFor(year, month, day);
        const num = document.createElement('div');
        num.className = 'daynum';
        num.textContent = day;
        td.appendChild(num);

        const entries = data[key] || [];
        const entriesDiv = document.createElement('div');
        entriesDiv.className = 'entries';
        entries.slice(0,2).forEach(txt => {
          const e = document.createElement('div');
          e.className = 'entry';
          e.textContent = txt;
          entriesDiv.appendChild(e);
        });
        if (entries.length > 2) {
          const more = document.createElement('div');
          more.className = 'more';
          more.textContent = `+${entries.length - 2} more`;
          entriesDiv.appendChild(more);
        }
        td.appendChild(entriesDiv);
        td.addEventListener('click', () => openModal(key));
        day++;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
  return container;
}

function render() {
  monthsEl.innerHTML = '';
  const m1 = buildMonthTable(baseYear, baseMonth);
  let y2 = baseYear, m2 = baseMonth + 1;
  if (m2 > 11) { m2 = 0; y2++; }
  const m2el = buildMonthTable(y2, m2);
  monthsEl.appendChild(m1);
  monthsEl.appendChild(m2el);
  rangeLabel.textContent = `${MONTH_NAMES[baseMonth]} ${baseYear} - ${MONTH_NAMES[m2]} ${y2}`;
}

document.getElementById('prev').addEventListener('click', () => {
  baseMonth--;
  if (baseMonth < 0) { baseMonth = 11; baseYear--; }
  render();
});
document.getElementById('next').addEventListener('click', () => {
  baseMonth++;
  if (baseMonth > 11) { baseMonth = 0; baseYear++; }
  render();
});

function openModal(key) {
  currentKey = key;
  const [y,m,d] = key.split('-').map(Number);
  modalDate.textContent = `${MONTH_NAMES[m-1]} ${d}, ${y}`;
  renderEntryList();
  overlay.classList.add('open');
  entryInput.value = '';
  entryInput.focus();
}

function renderEntryList() {
  entryList.innerHTML = '';
  const entries = data[currentKey] || [];
  if (entries.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Nothing yet.';
    li.style.color = 'var(--muted)';
    entryList.appendChild(li);
  }
  entries.forEach((txt, idx) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = txt;
    const btn = document.createElement('button');
    btn.textContent = 'remove';
    btn.addEventListener('click', async () => {
      entries.splice(idx,1);
      if (entries.length === 0) delete data[currentKey];
      await saveData();
      renderEntryList();
      render();
    });
    li.appendChild(span);
    li.appendChild(btn);
    entryList.appendChild(li);
  });
}

async function addEntry() {
  const val = entryInput.value.trim();
  if (!val || !currentKey) return;
  if (!data[currentKey]) data[currentKey] = [];
  data[currentKey].push(val);
  entryInput.value = '';
  await saveData();
  renderEntryList();
  render();
}

document.getElementById('addBtn').addEventListener('click', addEntry);
entryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addEntry();
  }
});

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('open');
});

loadData();
</script>
</body>
</html>
