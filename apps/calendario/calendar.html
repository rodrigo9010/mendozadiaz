<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario</title>
<style>
  :root {
    --ink: #1c2b2d;
    --paper: #f6f3ea;
    --line: #d8d0bd;
    --teal: #2f5c58;
    --coral: #c85f42;
    --muted: #8a8577;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 80px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: 0.02em; }
  .badge {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--coral);
    color: var(--paper);
    padding: 3px 8px;
    border-radius: 3px;
  }
  #rangeLabel {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .months { display: grid; grid-template-columns: 1fr; gap: 40px; }
  @media (min-width: 780px) {
    .months { grid-template-columns: 1fr 1fr; }
    .months > :nth-child(1) { grid-column: 1; grid-row: 1; } /* November */
    .months > :nth-child(2) { grid-column: 2; grid-row: 1 / span 2; } /* December */
    .months > :nth-child(3) { grid-column: 1; grid-row: 2; } /* January */
  }
  .month-title { font-size: 1.15rem; margin: 0 0 10px; font-weight: bold; color: var(--teal); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: normal;
    padding-bottom: 6px;
  }
  td {
    border: 1px solid var(--line);
    height: 76px;
    vertical-align: top;
    padding: 4px;
    position: relative;
  }
  td.clickable { cursor: pointer; transition: background 0.15s; }
  td.clickable:hover { background: rgba(47,92,88,0.06); }
  td.empty { background: transparent; border-color: transparent; }
  .daynum { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.7rem; color: var(--muted); }
  .entries { margin-top: 2px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.68rem; line-height: 1.3; }
  .entry {
    background: var(--coral);
    color: var(--paper);
    border-radius: 3px;
    padding: 1px 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .more { color: var(--teal); font-size: 0.62rem; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,43,45,0.55);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    max-width: 420px;
    width: 100%;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .modal h2 { font-family: Georgia, serif; font-size: 1.1rem; margin: 0 0 14px; }
  .modal ul { list-style: none; padding: 0; margin: 0 0 14px; max-height: 220px; overflow-y: auto; }
  .modal li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .modal li button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .modal li button:hover { color: var(--coral); }
  .modal input[type=text] { flex: 1; padding: 8px; border: 1px solid var(--line); background: white; font-family: inherit; }
  .modal input[type=text]:focus { outline: 2px solid var(--teal); }
  .modal button.add { background: var(--teal); color: var(--paper); border: none; padding: 8px 14px; cursor: pointer; }
  .modal button.add:hover { background: var(--ink); }
  .close-row { text-align: right; margin-top: 12px; }
  .close-row button { background: none; border: 1px solid var(--muted); color: var(--muted); padding: 5px 12px; cursor: pointer; font-size: 0.8rem; }
  .status { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.7rem; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <h1>Calendario</h1>
      <span class="badge" id="modeBadge">loading…</span>
    </div>
    <span id="rangeLabel"></span>
  </header>
  <div class="months" id="months"></div>
  <div class="status" id="status">Loading...</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalDate"></h2>
    <ul id="entryList"></ul>
    <div id="addRow" style="display:flex; gap:8px;">
      <input type="text" id="entryInput" placeholder="Add something..." autocomplete="off">
      <button type="button" id="addBtn" class="add">Add</button>
    </div>
    <div class="close-row"><button id="closeModal">Close</button></div>
  </div>
</div>

<script>
// One page, two modes:
// - Edit mode: local server (server.js) is reachable at /data and /save.
//   Add/remove UI is shown, changes write straight to data.json on disk.
// - View mode (default when no local server, e.g. the public site):
//   reads data.json as a static file, no write UI at all.
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let data = {}; // { "YYYY-MM-DD": [ "entry1", "entry2" ] }
let currentKey = null;
let editable = false;

const monthsEl = document.getElementById('months');
const rangeLabel = document.getElementById('rangeLabel');
const statusEl = document.getElementById('status');
const modeBadge = document.getElementById('modeBadge');
const overlay = document.getElementById('overlay');
const modalDate = document.getElementById('modalDate');
const entryList = document.getElementById('entryList');
const entryInput = document.getElementById('entryInput');
const addRow = document.getElementById('addRow');

function pad(n) { return String(n).padStart(2,'0'); }
function keyFor(y,m,d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

// Try the local editor server first (short timeout so the public site
// doesn't hang waiting on a server that isn't there); fall back to
// reading the static data.json file read-only.
async function loadData() {
  statusEl.textContent = "Loading calendar...";
  try {
    const res = await fetch('/data', { signal: AbortSignal.timeout(800) });
    if (!res.ok) throw new Error('no local server');
    data = await res.json();
    editable = true;
    modeBadge.textContent = 'local editor';
    statusEl.textContent = "Loaded from data.json. Edits save straight to disk.";
  } catch (e) {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      data = await res.json();
    } catch (e2) {
      data = {};
    }
    editable = false;
    modeBadge.textContent = 'read-only';
    statusEl.textContent = "Read-only view. Editing happens locally.";
  }
  addRow.style.display = editable ? 'flex' : 'none';
  render();
}

async function saveData() {
  if (!editable) return;
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    statusEl.textContent = result.ok ? "Saved to data.json." : "Save failed: " + result.error;
  } catch (e) {
    statusEl.textContent = "Save failed, is server.js still running?";
  }
}

function buildMonthTable(year, month) {
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const container = document.createElement('div');
  const title = document.createElement('h3');
  title.className = 'month-title';
  title.textContent = `${MONTH_NAMES[month]} ${year}`;
  container.appendChild(title);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
    const th = document.createElement('th');
    th.textContent = d;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  let day = 1;
  let started = false;
  for (let row = 0; row < 6 && day <= daysInMonth; row++) {
    const tr = document.createElement('tr');
    for (let dow = 0; dow < 7; dow++) {
      const td = document.createElement('td');
      if (!started && dow === startDow) started = true;
      if (!started || day > daysInMonth) {
        td.className = 'empty';
      } else {
        const key = keyFor(year, month, day);
        const num = document.createElement('div');
        num.className = 'daynum';
        num.textContent = day;
        td.appendChild(num);

        const entries = data[key] || [];
        const entriesDiv = document.createElement('div');
        entriesDiv.className = 'entries';
        entries.slice(0,2).forEach(txt => {
          const e = document.createElement('div');
          e.className = 'entry';
          e.textContent = txt;
          entriesDiv.appendChild(e);
        });
        if (entries.length > 2) {
          const more = document.createElement('div');
          more.className = 'more';
          more.textContent = `+${entries.length - 2} more`;
          entriesDiv.appendChild(more);
        }
        td.appendChild(entriesDiv);
        if (editable || entries.length > 0) {
          td.classList.add('clickable');
          td.addEventListener('click', () => openModal(key));
        }
        day++;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
  return container;
}

// Fixed 3-month range: Nov 2026, Dec 2026, Jan 2027.
// Explicit grid placement (see CSS) puts December on the right
// spanning both rows, with January under November on the left.
const FIXED_MONTHS = [
  { year: 2026, month: 10 }, // November
  { year: 2026, month: 11 }, // December
  { year: 2027, month: 0 },  // January
];

function render() {
  monthsEl.innerHTML = '';
  FIXED_MONTHS.forEach(({ year, month }) => {
    monthsEl.appendChild(buildMonthTable(year, month));
  });
  rangeLabel.textContent = 'November 2026 – January 2027';
}

function openModal(key) {
  currentKey = key;
  const [y,m,d] = key.split('-').map(Number);
  modalDate.textContent = `${MONTH_NAMES[m-1]} ${d}, ${y}`;
  renderEntryList();
  overlay.classList.add('open');
  if (editable) {
    entryInput.value = '';
    entryInput.focus();
  }
}

function renderEntryList() {
  entryList.innerHTML = '';
  const entries = data[currentKey] || [];
  if (entries.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Nothing yet.';
    li.style.color = 'var(--muted)';
    entryList.appendChild(li);
  }
  entries.forEach((txt, idx) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = txt;
    li.appendChild(span);
    if (editable) {
      const btn = document.createElement('button');
      btn.textContent = 'remove';
      btn.addEventListener('click', async () => {
        entries.splice(idx,1);
        if (entries.length === 0) delete data[currentKey];
        await saveData();
        renderEntryList();
        render();
      });
      li.appendChild(btn);
    }
    entryList.appendChild(li);
  });
}

async function addEntry() {
  if (!editable) return;
  const val = entryInput.value.trim();
  if (!val || !currentKey) return;
  if (!data[currentKey]) data[currentKey] = [];
  data[currentKey].push(val);
  entryInput.value = '';
  await saveData();
  renderEntryList();
  render();
}

document.getElementById('addBtn').addEventListener('click', addEntry);
entryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addEntry();
  }
});

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('open');
});

loadData();
</script>
</body>
</html>
