  h1 {
    font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    letter-spacing: 0.01em;
    line-height: 1.25;

  p.note {
    font-weight: 300;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 2.5rem;

  a.back {
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  a.back:hover {
    border-color: var(--fg);
  }
